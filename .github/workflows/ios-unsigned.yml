
name: Build OTP Security Tester IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iOS/**"
      - "project.yml"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail

          xcodebuild \
            -project OTPSecurityTester.xcodeproj \
            -scheme OTPSecurityTester \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee build.log

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OTPSecurityTester.app"

          test -d "$APP_PATH"

          mkdir -p package/Payload

          cp -R "$APP_PATH" package/Payload/

          cd package

          zip -r ../OTP-Security-Tester-unsigned.ipa Payload

          cd ..

          ls -lh OTP-Security-Tester-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OTP-Security-Tester-unsigned-IPA
          path: OTP-Security-Tester-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
